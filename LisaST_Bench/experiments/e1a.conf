# E1a: how many problems each strategy solves, uncertified (no proof term, no kernel check).
#
# One strategy per configuration rather than a portfolio in one process: a StarExec job pair gets one CPU, so
# a portfolio run there would contend eight strategies on one core and measure the contention. The portfolio
# is reconstructed offline as the per-problem minimum over these eight, and labelled as such.
defaults dataset=casc-j13-fof mode=uncert timeout=180000

balanced           strategy=balanced
weight-greedy      strategy=weight-greedy
age-fair           strategy=age-fair
occurrence         strategy=occurrence
equational         strategy=equational
unary-redundancy   strategy=unary-redundancy
subsumption-light  strategy=subsumption-light
first-negative     strategy=first-negative
