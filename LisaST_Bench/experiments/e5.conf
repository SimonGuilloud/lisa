# E5: what SInE axiom selection is worth, on and off, everything else equal.
#
# Reported over the problems with at least 500 hypotheses, which is `SineConfig.minAxioms`: below that
# `Sine.select` keeps every hypothesis, so SInE is inert and the two configurations are the same run. The
# split is the solver's own activation condition, not a number picked for the paper, and it happens in the
# analysis rather than here -- every row records its hypothesis count, so no separate dataset is needed.
defaults dataset=casc-j13-fof mode=cert strategy=balanced timeout=180000

sine-off  sine=off
sine-on   sine=on
