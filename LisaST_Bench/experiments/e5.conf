# E5: what SInE axiom selection is worth, on and off, and at which activation threshold.
#
# `minAxioms` is the hypothesis count below which `Sine.select` keeps everything, so it decides whether
# selection runs at all. It is a configuration of this experiment rather than a constant because changing it
# once, from 32 to 500 in `bba9f661`, turned selection off for every problem with 32 to 499 hypotheses -- 124
# of the CASC 400 -- and cost seven problems that the competition entry had solved, three of them (NUM292+1,
# NUM321+1, NUM335+1, 401 hypotheses each) in under twelve seconds. Bisected to that one line, and confirmed
# by putting it back at HEAD, where the problem is proved again.
#
# Which threshold is right is a measurement, not a revert. SInE is incomplete: pruning can drop an axiom the
# proof needed, turning a solvable problem into a saturation over a weaker one. So the two thresholds run
# against each other and the corpus decides. `sine-on-32` against `sine-on` isolates the change; `sine-off`
# is the floor both are measured from.
#
# The analysis splits by hypothesis count, since a problem below a configuration's own threshold is the same
# run under both and can only dilute the comparison. Every row records that count, so no separate dataset is
# needed. Note `strategy=` replaces the whole option record, so the sine keys must follow it on a line.
defaults dataset=casc-j13-fof mode=cert strategy=balanced timeout=180000

sine-off     sine=off
sine-on      sine=on
sine-on-32   sine=on sineMin=32
