# E3: what each redundancy mechanism is worth, one ablation per configuration against a common baseline.
#
# Measured two ways, because time and work answer different questions. This file bounds each problem by wall
# clock, so a mechanism that saves inferences but costs more per inference shows up as it would to a user.
# `e3-given` runs the same nine bounded by given-clause count instead, where only the inference saving shows.
#
# `index-off` is only the forward-unit-deletion index: the fingerprint, feature-vector and discrimination-tree
# indices are not switchable, so this measures one index rather than indexing as such.
defaults dataset=casc-j13-fof mode=cert strategy=balanced timeout=180000

baseline        equality=on
fwdsubs-off     fwdSubs=off
bwdsubs-off     bwdSubs=off
sr-off          fwdSR=off bwdSR=off
demod-off       fwdDemod=off bwdDemod=off
cond-on         cond=on
gensimplify-on  genSimplify=on
index-off       fwdUDIndex=1000000000
sr-and-index-off fwdSR=off bwdSR=off fwdUDIndex=1000000000
