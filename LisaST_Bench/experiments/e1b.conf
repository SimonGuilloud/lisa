# E1b: the same portfolio certified -- clausify, reconstruct, and kernel-check the composed proof.
# Against E1a this is what the certificate costs, per strategy and per problem.
#
# `portfolio` makes this ONE configuration, not eight. A StarExec job pair is granted eight cores (runsolver
# is invoked `--cores 0-7`), which is the hardware CASC ran on, so the portfolio can be measured as it is
# actually shipped: eight strategies started together, each pinned to its own core, each with the 12 GiB heap
# a competition worker had. Running the strategies as eight separate configurations and taking a per-problem
# minimum afterwards would describe a portfolio nobody ran -- eight sequential runs do not share a wall clock.
#
# Unlike the shipped portfolio, no worker is killed when another succeeds: every strategy runs to the end of
# the budget. That costs nothing (the cores are idle either way) and buys the per-strategy columns that E1's
# analysis needs -- what each strategy would have done alone, at the same time, on the same machine.
#
# Run locally, `run.sh` ignores the `portfolio` line and runs the eight sequentially, which is the same
# measurement per strategy but not a portfolio result. Only the cluster's numbers are a portfolio.
defaults dataset=casc-j13-fof mode=cert timeout=180000
portfolio

balanced           strategy=balanced
weight-greedy      strategy=weight-greedy
age-fair           strategy=age-fair
occurrence         strategy=occurrence
equational         strategy=equational
unary-redundancy   strategy=unary-redundancy
subsumption-light  strategy=subsumption-light
first-negative     strategy=first-negative
