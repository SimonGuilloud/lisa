# E1b: the same eight strategies certified — clausify, reconstruct, and kernel-check the composed proof.
# Against E1a this is what the certificate costs, per strategy and per problem.
defaults dataset=casc-j13-fof mode=cert timeout=180000

balanced           strategy=balanced
weight-greedy      strategy=weight-greedy
age-fair           strategy=age-fair
occurrence         strategy=occurrence
equational         strategy=equational
unary-redundancy   strategy=unary-redundancy
subsumption-light  strategy=subsumption-light
first-negative     strategy=first-negative
