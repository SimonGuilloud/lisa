# E3, the same nine ablations as `e3-time`, bounded by given-clause count rather than wall clock: what each
# mechanism saves in inferences, with the cost of running it removed. Deterministic, so it needs no cluster.
#
# `given` was open decision 3, and `e3-time` (StarExec job 7426) has now settled it at **50000**. Its baseline
# found its 112 proofs at a median of 1183 given clauses, 28869 at the 95th percentile and 36244 at the most,
# so 50000 clears every proof that configuration found at the competition's own budget. The point of the
# experiment is that an ablation which saves inferences shows a lower count and one that costs inferences
# shows a higher one, so the bound has to sit above the baseline rather than at it -- an ablation stopped at
# 50000 has genuinely failed to find the proof within the budget, which is a result, unlike a run the clock
# stopped, which is only censored.
#
# 600 s is what makes the count bind rather than the clock. At 180 s a timing-out baseline run reached a
# median of 27717 given clauses, so 50000 is roughly 325 s of work: comfortably inside 600 s for most
# problems, and the analysis reports the ones where the clock won anyway.
#
# The bound is a cost cap, not the measurement: every refutation records `given` at the moment of proof, so
# "solved within N" is that column's cumulative distribution and the analysis reports the whole curve.
defaults dataset=casc-j13-fof mode=cert strategy=balanced timeout=600000 given=50000

baseline        equality=on
fwdsubs-off     fwdSubs=off
bwdsubs-off     bwdSubs=off
sr-off          fwdSR=off bwdSR=off
demod-off       fwdDemod=off bwdDemod=off
cond-on         cond=on
gensimplify-on  genSimplify=on
index-off       fwdUDIndex=1000000000
sr-and-index-off fwdSR=off bwdSR=off fwdUDIndex=1000000000
