# E3, the same nine ablations as `e3-time`, bounded by given-clause count rather than wall clock: what each
# mechanism saves in inferences, with the cost of running it removed. Deterministic, so it needs no cluster.
#
# `given` is open decision 3 in the implementation plan and is NOT settled -- 20000 is a holding value, to be
# replaced once `e3-time` has run at the real 180 s budget and its given-at-proof distribution is known. A
# value read off a short run would describe only the proofs findable in seconds, which are not the problems
# this experiment discriminates on.
#
# The bound is a cost cap, not the measurement: every refutation records `given` at the moment of proof, so
# "solved within N" is that column's cumulative distribution and the analysis reports the whole curve. What
# the bound must do is bind before `timeout` does -- a run the clock stops is censored, not failed, and the
# analysis has to mark it as such.
defaults dataset=casc-j13-fof mode=cert strategy=balanced timeout=600000 given=20000

baseline        equality=on
fwdsubs-off     fwdSubs=off
bwdsubs-off     bwdSubs=off
sr-off          fwdSR=off bwdSR=off
demod-off       fwdDemod=off bwdDemod=off
cond-on         cond=on
gensimplify-on  genSimplify=on
index-off       fwdUDIndex=1000000000
sr-and-index-off fwdSR=off bwdSR=off fwdUDIndex=1000000000
